name: Deploy BottleTrack to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Find recent successful Pages builds
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              status: 'success',
              branch: 'main',
              per_page: 30,
            });
            const previous = data.workflow_runs
              .filter(run => String(run.id) !== String(context.runId) && run.head_branch === 'main')
              .slice(0, 20)
              .map(run => run.id);
            core.setOutput('run-ids', JSON.stringify(previous));
      - name: Download recent Pages artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RUN_IDS: ${{ steps.previous.outputs.run-ids }}
        run: |
          mkdir -p previous-pages
          for run_id in $(echo "$PREVIOUS_RUN_IDS" | jq -r '.[]'); do
            gh run download "$run_id" --name github-pages --dir "previous-pages/$run_id" || true
          done
      - name: Keep older assets available for cached pages
        run: |
          mkdir -p previous-site
          for artifact in previous-pages/*/artifact.tar; do
            [ -f "$artifact" ] || continue
            tar -xf "$artifact" -C previous-site
            if [ -d previous-site/assets ]; then
              cp -n previous-site/assets/* dist/assets/ 2>/dev/null || true
            fi
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          retention-days: 90
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
